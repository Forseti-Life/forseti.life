<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AmISafe Mobile App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        #root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        /* Mobile frame simulation */
        .mobile-frame {
            max-width: 414px;
            margin: 0 auto;
            height: 100%;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        @media (min-width: 768px) {
            .mobile-frame {
                margin-top: 20px;
                height: calc(100% - 40px);
                border-radius: 20px;
            }
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .loading h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .loading p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="mobile-frame">
            <div class="loading">
                <h1>🛡️</h1>
                <h2>AmISafe</h2>
                <p>Crime Safety Mobile App</p>
                <div class="spinner"></div>
                <p style="margin-top: 20px; font-size: 14px;">Loading application...</p>
            </div>
        </div>
    </div>
    
    <script>
        // Redirect to the working web test interface after a short delay
        setTimeout(() => {
            window.location.href = '/web-test.html';
        }, 2000);
    </script>
</body>
</html>
