# ==============================================================================
# ADMIN ROUTES
# ==============================================================================

dungeoncrawler_content.settings:
  path: '/admin/config/content/dungeoncrawler'
  defaults:
    _form: '\Drupal\dungeoncrawler_content\Form\DungeonCrawlerSettingsForm'
    _title: 'Dungeon Crawler Settings'
  requirements:
    _permission: 'administer site configuration'

dungeoncrawler_content.dashboard:
  path: '/admin/content/dungeoncrawler'
  defaults:
    _controller: '\Drupal\dungeoncrawler_content\Controller\DashboardController::content'
    _title: 'Game Content Dashboard'
  methods: [GET]
  requirements:
    _permission: 'access content overview'

dungeoncrawler_content.game_objects:
  path: '/dungeoncrawler/objects'
  defaults:
    _controller: '\Drupal\dungeoncrawler_content\Controller\GameObjectsController::content'
    _title: 'Game Object Manager'
  methods: [GET, POST]
  requirements:
    _permission: 'administer dungeoncrawler content'

dungeoncrawler_content.gemini_image_interface:
  path: '/admin/content/dungeoncrawler/gemini-image'
  defaults:
    _form: '\Drupal\dungeoncrawler_content\Form\ImageGenerationInterfaceForm'
    _title: 'Image Generation'
  methods: [GET, POST]
  requirements:
    _permission: 'access content overview'

dungeoncrawler_content.image_generation_interface:
  path: '/admin/content/dungeoncrawler/image-generation'
  defaults:
    _form: '\Drupal\dungeoncrawler_content\Form\ImageGenerationInterfaceForm'
    _title: 'Image Generation'
  methods: [GET, POST]
  requirements:
    _permission: 'access content overview'

# Admin testing home (locked to admins)
dungeoncrawler_content.testing_home:
  path: '/admin/dungeoncrawler/testing'
  defaults:
    _controller: '\Drupal\dungeoncrawler_content\Controller\TestingDashboardController::dashboard'
    _title: 'Dungeon Crawler Testing'
  methods: [GET]
  requirements:
    _permission: 'administer dungeoncrawler content'

# ==============================================================================
# PUBLIC PAGES
# ==============================================================================

dungeoncrawler_content.home:
  path: '/home'
  defaults:
    _controller: '\Drupal\dungeoncrawler_content\Controller\HomeController::index'
    _title: 'Dungeon Crawler Life'
  methods: [GET]
  requirements:
    _access: 'TRUE'

dungeoncrawler_content.world:
  path: '/world'
  defaults:
    _controller: '\Drupal\dungeoncrawler_content\Controller\WorldController::index'
    _title: 'The Living Dungeon'
  methods: [GET]
  requirements:
    _access: 'TRUE'

dungeoncrawler_content.how_to_play:
  path: '/how-to-play'
  defaults:
    _controller: '\Drupal\dungeoncrawler_content\Controller\HowToPlayController::index'
    _title: 'How to Play'
  methods: [GET]
  requirements:
    _access: 'TRUE'

dungeoncrawler_content.about:
  path: '/about'
  defaults:
    _controller: '\Drupal\dungeoncrawler_content\Controller\AboutController::index'
    _title: 'About Dungeon Crawler Life'
  methods: [GET]
  requirements:
    _access: 'TRUE'

dungeoncrawler_content.credits:
  path: '/credits'
  defaults:
    _controller: '\Drupal\dungeoncrawler_content\Controller\CreditsController::page'
    _title: 'Credits & Attribution'
  methods: [GET]
  requirements:
    _access: 'TRUE'

dungeoncrawler_content.controller_architecture:
  path: '/architecture/controllers'
  defaults:
    _controller: '\Drupal\dungeoncrawler_content\Controller\ControllerArchitectureController::overview'
    _title: 'Controller Architecture'
  methods: [GET]
  requirements:
    _permission: 'access content'

dungeoncrawler_content.encounter_ai_integration:
