dungeoncrawler_tester.settings:
  type: config_object
  label: 'Dungeon Crawler tester settings'
  mapping:
    github_repo:
      type: string
      label: 'GitHub repository'
    github_token:
      type: string
      label: 'GitHub token'
    copilot_assignment_required_label:
      type: string
      label: 'Required label for Copilot assignment'
    copilot_assignment_max_open:
      type: integer
      label: 'Max open Copilot-assigned issues for auto-assignment'
