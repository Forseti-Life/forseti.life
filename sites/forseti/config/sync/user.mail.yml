cancel_confirm:
  subject: 'Account Cancellation Request - [site:name]'
  body: |-
    Hello [user:display-name],

    We've received a request to cancel your Forseti account. We're sorry to see you go.

    To confirm this cancellation, click the link below:

    [user:cancel-url]

    ⚠️ IMPORTANT: This action is permanent and cannot be undone. All your data, preferences, and safety alerts will be removed.

    This link expires in 24 hours. If you didn't request this, simply ignore this email and your account will remain active.

    Stay safe,
    The Forseti Team
    
    ---
    Forseti.life - AI Looking Out For Us
    Building safer communities through intelligent monitoring
