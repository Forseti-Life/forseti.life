copilot_agent_tracker.dashboard:
  path: '/admin/reports/copilot-agent-tracker'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::dashboard'
    _title: 'Copilot Agent Tracker'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.agent:
  path: '/admin/reports/copilot-agent-tracker/agent/{agent_id}'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::agent'
    _title: 'Agent'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.agent_inbox_item:
  path: '/admin/reports/copilot-agent-tracker/agent/{agent_id}/inbox/{item_id}'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::agentInboxItem'
    _title: 'Inbox item'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.waiting_on_keith:
  path: '/admin/reports/waitingonkeith'
  defaults:
     _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::waitingOnKeithRedirect'
     _title: 'Waiting on Keith'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.release_notes:
  path: '/admin/reports/copilot-agent-tracker/releases'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::releaseNotes'
    _title: 'Release Notes'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.architecture:
  path: '/admin/reports/copilot-agent-tracker/architecture'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::architecture'
    _title: 'Agentic Architecture'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.release_notes_release:
  path: '/admin/reports/copilot-agent-tracker/releases/{release_id}'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::releaseNotesRelease'
    _title: 'Release Status'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.release_notes_release_testingresults:
  path: '/admin/reports/copilot-agent-tracker/releases/{release_id}/testingresults'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::releaseTestingResults'
    _title: 'Testing Results'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.waiting_on_keith_message:
  path: '/admin/reports/waitingonkeith/{item_id}'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::waitingOnKeithMessage'
    _title: 'Inbox message'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.waiting_on_keith_approve:
  path: '/admin/reports/waitingonkeith/{item_id}/approve'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::approveWaitingOnKeithItem'
    _title: 'Approve'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.dismiss_sent_message:
  path: '/admin/reports/waitingonkeith/sent/{reply_id}/dismiss'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::dismissSentMessage'
    _title: 'Dismiss sent message'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.api_event:
  path: '/api/copilot-agent-tracker/event'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\ApiController::event'
  methods: [POST]
  requirements:
    _csrf_request_header_mode: TRUE
    # Token-gated in controller; route must be reachable by non-browser senders.
    _access: 'TRUE'
  options:
    _format: json

copilot_agent_tracker.langgraph_session:
  path: '/admin/reports/copilot-agent-tracker/langgraph/session'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::langGraphSessionMonitoring'
    _title: 'LangGraph Session Monitoring'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.langgraph_dashboard:
  path: '/admin/reports/copilot-agent-tracker/langgraph'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::langGraphDashboard'
    _title: 'LangGraph Dashboard'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.langgraph_feature_progress:
  path: '/admin/reports/copilot-agent-tracker/langgraph/feature-progress'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::langGraphFeatureProgress'
    _title: 'LangGraph Feature Progress'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.langgraph_parity:
  path: '/admin/reports/copilot-agent-tracker/langgraph/parity'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::langGraphParityHealth'
    _title: 'LangGraph Engine / Parity Health'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.langgraph_release_status:
  path: '/admin/reports/copilot-agent-tracker/langgraph/release-status'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\DashboardController::langGraphReleaseStatus'
    _title: 'LangGraph Release-cycle Status'
  requirements:
    _permission: 'administer copilot agent tracker'

copilot_agent_tracker.llm_management:
  path: '/admin/reports/copilot-agent-tracker/llm-management'
  defaults:
    _form: '\Drupal\copilot_agent_tracker\Form\LlmManagementForm'
    _title: 'LLM Management'
  requirements:
    _permission: 'administer copilot agent tracker'
