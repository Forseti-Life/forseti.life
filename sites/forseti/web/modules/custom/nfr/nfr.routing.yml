# Public Pages
# Note: Most public content pages should be created as Drupal Basic Page nodes
# and accessed via their aliases (e.g., /nfr/about, /nfr/how-it-works, etc.)
# Use Path module to set URL aliases like /nfr/about
# Only custom functionality pages need custom routes below:

nfr.home:
  path: '/nfr'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRPublicController::home'
    _title: 'National Firefighter Registry'
  requirements:
    _permission: 'access content'

nfr.public_data:
  path: '/nfr/data'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRPublicController::publicData'
    _title: 'Public Statistics'
  requirements:
    _permission: 'access content'

# Enrollment/Registration Pages
# Registration uses standard Drupal user registration at /user/register
# NFR-specific fields added via user profile fields
# Email verification handled by Drupal core
# Login at /user/login, Password reset at /user/password

nfr.consent:
  path: '/nfr/consent'
  defaults:
    _form: '\Drupal\nfr\Form\NFRConsentForm'
    _title: 'Informed Consent'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

nfr.user_profile:
  path: '/nfr/profile'
  defaults:
    _form: '\Drupal\nfr\Form\NFRUserProfileForm'
    _title: 'User Profile'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

nfr.enrollment_questionnaire:
  path: '/nfr/questionnaire'
  defaults:
    _form: '\Drupal\nfr\Form\NFRQuestionnaireForm'
    _title: 'Enrollment Questionnaire'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

nfr.review_submit:
  path: '/nfr/review'
  defaults:
    _form: '\Drupal\nfr\Form\NFRReviewSubmitForm'
    _title: 'Review & Submit'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

nfr.confirmation:
  path: '/nfr/confirmation'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFREnrollmentController::confirmation'
    _title: 'Enrollment Confirmation'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

# Participant Dashboard Pages
# Note: Standard Drupal user profile available at /user/{uid}
# Standard account settings at /user/{uid}/edit
# Below are NFR-specific dashboard pages:

nfr.my_dashboard:
  path: '/nfr/my-dashboard'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRDashboardController::myDashboard'
    _title: 'My Dashboard'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

nfr.follow_up:
  path: '/nfr/follow-up'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRDashboardController::followUp'
    _title: 'Follow-Up Survey'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

# Administrative Pages
# Note: Participant list (/admin/nfr/participants) should be created as a View
# with filters, sorting, and bulk operations instead of custom controller
# Report Builder (/admin/nfr/reports) can use Views + Views Data Export module
# User Issues queue could use existing support/ticketing modules

nfr.admin_dashboard:
  path: '/admin/nfr'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRAdminController::adminDashboard'
    _title: 'NFR Administration'
  requirements:
    _permission: 'administer nfr'

nfr.admin_participants:
  path: '/admin/nfr/participants'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRAdminController::participantList'
    _title: 'Participant Management'
  requirements:
    _permission: 'administer nfr'

nfr.admin_participant_detail:
  path: '/admin/nfr/participant/{id}'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRAdminController::participantDetail'
    _title: 'Participant Details'
  requirements:
    _permission: 'administer nfr'

nfr.admin_linkage:
  path: '/admin/nfr/linkage'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRAdminController::linkageManagement'
    _title: 'Cancer Registry Linkage'
  requirements:
    _permission: 'administer nfr'

nfr.admin_data_quality:
  path: '/admin/nfr/data-quality'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRAdminController::dataQuality'
    _title: 'Data Quality Monitor'
  requirements:
    _permission: 'administer nfr'

nfr.admin_reports:
  path: '/admin/nfr/reports'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRAdminController::reportBuilder'
    _title: 'Report Builder'
  requirements:
    _permission: 'view nfr reports'

nfr.admin_issues:
  path: '/admin/nfr/issues'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRAdminController::userIssues'
    _title: 'User Support Issues'
  requirements:
    _permission: 'administer nfr'

nfr.admin_settings:
  path: '/admin/nfr/settings'
  defaults:
    _controller: '\Drupal\nfr\Controller\NFRAdminController::systemSettings'
    _title: 'System Settings'
  requirements:
    _permission: 'administer nfr'
