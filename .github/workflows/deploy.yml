name: Deploy Forseti Site to Production (Optimized)

on:
  push:
    branches: [ main ]
    paths:
      - 'sites/forseti/web/modules/custom/**'
      - 'sites/forseti/web/themes/custom/**'
      - 'sites/forseti/composer.json'
      - 'sites/forseti/composer.lock'
      - 'sites/forseti/config/sync/**'
      - 'sites/dungeoncrawler/web/modules/custom/**'
      - 'sites/dungeoncrawler/web/themes/custom/**'
      - 'sites/dungeoncrawler/composer.json'
      - 'sites/dungeoncrawler/composer.lock'
      - 'sites/dungeoncrawler/config/sync/**'
      - 'h3-geolocation/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Deploy to production
      uses: appleboy/ssh-action@v0.1.5
      env:
        HUBGIT_PAT: ${{ secrets.HUBGIT_PAT }}
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        envs: HUBGIT_PAT
        script: |
          set -e
          
          echo "=== FORSETI DEPLOYMENT STARTED ==="
          
          DRUPAL_ROOT="/var/www/html/forseti"
          TEMP_DIR="/tmp/deploy-$(date +%s)"
          
          # Single git clone with sparse checkout
          mkdir -p "$TEMP_DIR"
          cd "$TEMP_DIR"
          
          echo "Downloading code from repository..."
          git clone --depth 1 --filter=blob:none --sparse https://${HUBGIT_PAT}@github.com/keithaumiller/forseti.life.git .
          git sparse-checkout set sites/forseti sites/dungeoncrawler h3-geolocation
          
          # Deploy custom modules
          if [ -d "sites/forseti/web/modules/custom" ]; then
            echo "Deploying custom modules..."
            sudo rsync -av --delete sites/forseti/web/modules/custom/ "$DRUPAL_ROOT/web/modules/custom/"
            echo "✅ Modules deployed"
          fi
          
          # Deploy custom themes
          if [ -d "sites/forseti/web/themes/custom" ]; then
            echo "Deploying custom themes..."
            sudo rsync -av --delete sites/forseti/web/themes/custom/ "$DRUPAL_ROOT/web/themes/custom/"
            echo "✅ Themes deployed"
          fi
          
          # Deploy configuration
          if [ -d "sites/forseti/config/sync" ]; then
            echo "Deploying configuration..."
            sudo rsync -av --delete sites/forseti/config/sync/ "$DRUPAL_ROOT/config/sync/"
            echo "✅ Configuration deployed"
          fi
          
          # Deploy H3 geolocation (if exists)
          if [ -d "h3-geolocation" ]; then
            echo "Deploying H3 geolocation..."
            sudo rsync -av --exclude='h3-env' --exclude='__pycache__' h3-geolocation/ "$DRUPAL_ROOT/h3-geolocation/"
            echo "✅ H3 deployed"
          fi
          
          # Composer update (only if files changed)
          COMPOSER_CHANGED=false
          if [ -f "sites/forseti/composer.json" ]; then
            if ! cmp -s "sites/forseti/composer.json" "$DRUPAL_ROOT/composer.json"; then
              echo "Composer files changed, updating..."
              sudo cp "sites/forseti/composer.json" "$DRUPAL_ROOT/"
              [ -f "sites/forseti/composer.lock" ] && sudo cp "sites/forseti/composer.lock" "$DRUPAL_ROOT/"
              COMPOSER_CHANGED=true
            fi
          fi
          
          cd "$DRUPAL_ROOT"
          
          if [ "$COMPOSER_CHANGED" = true ]; then
            echo "Installing composer dependencies..."
            sudo -u www-data composer install --no-dev --optimize-autoloader --no-interaction
            echo "✅ Composer updated"
          else
            echo "ℹ️ Composer files unchanged, skipping"
          fi
          
          # Import configuration
          echo "Importing configuration..."
          sudo -u www-data ./vendor/bin/drush config:import -y || echo "⚠️ Config import warnings"
          
          # Database updates
          echo "Checking for database updates..."
          sudo -u www-data ./vendor/bin/drush updatedb -y || echo "ℹ️ No updates needed"
          
          # Fix permissions (batch operation)
          echo "Setting permissions..."
          sudo chown -R www-data:www-data "$DRUPAL_ROOT/web/modules/custom" \
            "$DRUPAL_ROOT/web/themes/custom" \
            "$DRUPAL_ROOT/config" \
            "$DRUPAL_ROOT/web/sites/default/files" 2>/dev/null || true
          
          sudo find "$DRUPAL_ROOT/web/modules/custom" "$DRUPAL_ROOT/web/themes/custom" \
            -type f -exec chmod 644 {} + -o -type d -exec chmod 755 {} + 2>/dev/null || true
          
          # Final cache clear (once)
          echo "Clearing all caches..."
          sudo rm -rf "$DRUPAL_ROOT/web/sites/default/files/css" \
            "$DRUPAL_ROOT/web/sites/default/files/js" \
            "$DRUPAL_ROOT/web/sites/default/files/php/twig" 2>/dev/null || true
          
          sudo -u www-data ./vendor/bin/drush cache:rebuild
          
          # ============================================================
          # DUNGEON CRAWLER DEPLOYMENT
          # ============================================================
          DC_ROOT="/var/www/html/dungeoncrawler"
          
          if [ -d "$DC_ROOT" ] && [ -d "sites/dungeoncrawler/web/modules/custom" ]; then
            echo ""
            echo "=== DUNGEON CRAWLER DEPLOYMENT ==="
            
            # Deploy custom modules
            if [ -d "sites/dungeoncrawler/web/modules/custom" ]; then
              echo "Deploying Dungeon Crawler custom modules..."
              sudo rsync -av --delete sites/dungeoncrawler/web/modules/custom/ "$DC_ROOT/web/modules/custom/"
              echo "✅ DC Modules deployed"
            fi
            
            # Deploy custom themes
            if [ -d "sites/dungeoncrawler/web/themes/custom" ]; then
              echo "Deploying Dungeon Crawler custom themes..."
              sudo rsync -av --delete sites/dungeoncrawler/web/themes/custom/ "$DC_ROOT/web/themes/custom/"
              echo "✅ DC Themes deployed"
            fi
            
            # Deploy configuration
            if [ -d "sites/dungeoncrawler/config/sync" ]; then
              echo "Deploying Dungeon Crawler configuration..."
              sudo rsync -av --delete sites/dungeoncrawler/config/sync/ "$DC_ROOT/config/sync/"
              echo "✅ DC Configuration deployed"
            fi
            
            # Composer update
            DC_COMPOSER_CHANGED=false
            if [ -f "sites/dungeoncrawler/composer.json" ]; then
              if ! cmp -s "sites/dungeoncrawler/composer.json" "$DC_ROOT/composer.json"; then
                echo "DC Composer files changed, updating..."
                sudo cp "sites/dungeoncrawler/composer.json" "$DC_ROOT/"
                [ -f "sites/dungeoncrawler/composer.lock" ] && sudo cp "sites/dungeoncrawler/composer.lock" "$DC_ROOT/"
                DC_COMPOSER_CHANGED=true
              fi
            fi
            
            cd "$DC_ROOT"
            
            if [ "$DC_COMPOSER_CHANGED" = true ]; then
              echo "Installing DC composer dependencies..."
              sudo -u www-data composer install --no-dev --optimize-autoloader --no-interaction
              echo "✅ DC Composer updated"
            fi
            
            # Import configuration
            echo "Importing DC configuration..."
            sudo -u www-data ./vendor/bin/drush config:import -y || echo "⚠️ DC Config import warnings"
            
            # Database updates
            echo "Checking DC database updates..."
            sudo -u www-data ./vendor/bin/drush updatedb -y || echo "ℹ️ No DC updates needed"
            
            # Fix permissions
            sudo chown -R www-data:www-data "$DC_ROOT/web/modules/custom" \
              "$DC_ROOT/web/themes/custom" \
              "$DC_ROOT/config" \
              "$DC_ROOT/web/sites/default/files" 2>/dev/null || true
            
            sudo find "$DC_ROOT/web/modules/custom" "$DC_ROOT/web/themes/custom" \
              -type f -exec chmod 644 {} + -o -type d -exec chmod 755 {} + 2>/dev/null || true
            
            # Cache clear
            sudo rm -rf "$DC_ROOT/web/sites/default/files/css" \
              "$DC_ROOT/web/sites/default/files/js" \
              "$DC_ROOT/web/sites/default/files/php/twig" 2>/dev/null || true
            
            sudo -u www-data ./vendor/bin/drush cache:rebuild
            
            echo "✅ Dungeon Crawler deployment complete"
          else
            echo "ℹ️ Dungeon Crawler not set up on production yet, skipping"
          fi
          
          # Clean up
          cd /tmp
          rm -rf "$TEMP_DIR"
          
          echo ""
          echo "🎉 DEPLOYMENT COMPLETED at $(date)"
          echo "✅ Changes live at https://forseti.life"

