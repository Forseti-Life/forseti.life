name: Deploy Forseti Site to Production (Optimized)

on:
  push:
    branches: [ main ]
    paths:
      - 'sites/forseti/web/modules/custom/**'
      - 'sites/forseti/web/themes/custom/**'
      - 'sites/forseti/composer.json'
      - 'sites/forseti/composer.lock'
      # Config changes require manual deployment - excluded from auto-deploy
      # - 'sites/forseti/config/sync/**'
      - 'sites/dungeoncrawler/web/modules/custom/**'
      - 'sites/dungeoncrawler/web/themes/custom/**'
      - 'sites/dungeoncrawler/composer.json'
      - 'sites/dungeoncrawler/composer.lock'
      # Config changes require manual deployment - excluded from auto-deploy
      # - 'sites/dungeoncrawler/config/sync/**'
      - 'h3-geolocation/**'
      - 'script/production/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Deploy to production
      uses: appleboy/ssh-action@v0.1.5
      env:
        HUBGIT_PAT: ${{ secrets.HUBGIT_PAT }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_ACTOR: ${{ github.actor }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        envs: HUBGIT_PAT,GITHUB_SHA,GITHUB_ACTOR,COMMIT_MESSAGE
        script: |
          set -e
          set -o pipefail
          
          # Enable debugging (verbose output)
          set -x
          
          # Error trap for debugging
          trap 'echo "❌ ERROR at line $LINENO: command \"$BASH_COMMAND\" failed with exit code $?" >&2' ERR
          
          DEPLOY_START=$(date +%s)
          echo "🚀 DEPLOYMENT STARTED at $(date)"
          echo "📝 Commit: ${GITHUB_SHA:0:8}"
          echo "👤 Author: $GITHUB_ACTOR"
          echo "💬 Message: $COMMIT_MESSAGE"
          echo "🐛 Debug mode: ENABLED"
          
          # Validate production environment
          if [ ! -d "/var/www/html" ]; then
            echo "❌ Production web root /var/www/html not found"
            exit 1
          fi
          echo "✅ Production environment validated"
          
          TEMP_DIR="/tmp/deploy-$(date +%s)"
          
          # Optimized git clone
          mkdir -p "$TEMP_DIR"
          cd "$TEMP_DIR"
          
          echo "Downloading code from repository..."
          git clone --depth 1 --single-branch --branch main --filter=blob:none --sparse https://${HUBGIT_PAT}@github.com/keithaumiller/forseti.life.git .
          git sparse-checkout set sites/forseti sites/dungeoncrawler h3-geolocation
          
          echo "🐛 Git clone completed. Checking HEAD commit..."
          git log -1 --oneline
          echo "🐛 Checking if files exist in cloned directory..."
          ls -la sites/forseti/web/modules/custom/job_hunter/src/Controller/ 2>/dev/null | head -5 || echo "Directory not found"
          
          # Detect what changed in this deployment
          echo "Detecting changed files..."
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null || echo "")
          echo "Changed paths: $(echo "$CHANGED_FILES" | grep -E '^(sites/|h3-geolocation/)' | cut -d'/' -f1-2 | sort -u | tr '\n' ' ')"
          
          # Reusable deployment function
          deploy_site() {
            local SITE_NAME=$1
            local SITE_ROOT=$2
            local SITE_PATH=$3
            local START_DIR=$(pwd)
            
            echo ""
            echo "=== ${SITE_NAME} DEPLOYMENT ==="
            local SITE_START=$(date +%s)
            
            # Track what was deployed
            local MODULES_DEPLOYED=false
            local THEMES_DEPLOYED=false
            local CONFIG_DEPLOYED=false
            
            # Deploy custom modules
            if [ -d "${SITE_PATH}/web/modules/custom" ]; then
              echo "Deploying custom modules..."
              echo "🐛 SOURCE: ${SITE_PATH}/web/modules/custom/"
              echo "🐛 DEST: ${SITE_ROOT}/web/modules/custom/"
              echo "🐛 Checking source file before rsync..."
              ls -la ${SITE_PATH}/web/modules/custom/job_hunter/src/Controller/JobHunterHomeController.php 2>/dev/null || echo "Source file not found"
              grep -c "public function" ${SITE_PATH}/web/modules/custom/job_hunter/src/Controller/JobHunterHomeController.php 2>/dev/null || echo "Cannot count functions"
              echo "🐛 Checking dest file before rsync..."
              ls -la ${SITE_ROOT}/web/modules/custom/job_hunter/src/Controller/JobHunterHomeController.php 2>/dev/null || echo "Dest file not found"
              
              sudo rsync -azv \
                --exclude='node_modules' \
                --exclude='.git' \
                --exclude='*.scss' \
                --exclude='src/' \
                "${SITE_PATH}/web/modules/custom/" "${SITE_ROOT}/web/modules/custom/" | head -30
              MODULES_DEPLOYED=true
              
              echo "🐛 Checking dest file after rsync..."
              ls -la ${SITE_ROOT}/web/modules/custom/job_hunter/src/Controller/JobHunterHomeController.php
              grep -c "public function" ${SITE_ROOT}/web/modules/custom/job_hunter/src/Controller/JobHunterHomeController.php || echo "Cannot count functions"
              echo "✅ Modules deployed"
            fi
            
            # Deploy custom themes
            if [ -d "${SITE_PATH}/web/themes/custom" ]; then
              echo "Deploying custom themes..."
              sudo rsync -azq \
                --exclude='node_modules' \
                --exclude='.git' \
                --exclude='*.scss' \
                --exclude='src/' \
                "${SITE_PATH}/web/themes/custom/" "${SITE_ROOT}/web/themes/custom/"
              THEMES_DEPLOYED=true
              echo "✅ Themes deployed"
            fi
            
            # Deploy configuration - DISABLED FOR SAFETY
            #
            # ⚠️ IMPORTANT: Config deployment is intentionally disabled to prevent
            # accidentally overwriting production with out-of-sync dev config.
            #
            # WHY THIS IS DISABLED:
            # - Dev and prod configs can legitimately differ (see .config-differences.yml)
            # - Automatic deployment could wipe production-specific settings
            # - Config changes need review and testing before production deployment
            # - Some modules only exist in one environment (backup_migrate in prod, devel in dev)
            #
            # HOW TO PROPERLY DEPLOY CONFIG:
            #
            # 1. ALWAYS sync from production first:
            #    cd ~/forseti.life/script/production
            #    ./compare-config.sh forseti root@your-server
            #    ./reconcile-config.sh forseti root@your-server use-prod
            #
            # 2. Make and test your config changes in development:
            #    drush config:set system.site name "New Name"
            #    drush config:export -y
            #
            # 3. Compare changes before committing:
            #    git diff sites/forseti/config/sync/
            #    ./compare-config.sh forseti root@your-server
            #
            # 4. If new expected differences, document them:
            #    Edit sites/forseti/.config-differences.yml
            #    Add patterns for environment-specific configs
            #
            # 5. Commit changes:
            #    git add sites/forseti/config/sync/
            #    git add sites/forseti/.config-differences.yml  # if updated
            #    git commit -m "Update config: describe your changes"
            #    git push
            #
            # 6. Manually deploy to production:
            #    ssh root@your-server
            #    cd /var/www/html/forseti
            #    git pull origin main
            #    
            #    # Review what will be imported:
            #    sudo -u www-data ./vendor/bin/drush config:import --preview=list
            #    
            #    # Import if changes look correct:
            #    sudo -u www-data ./vendor/bin/drush config:import -y
            #    sudo -u www-data ./vendor/bin/drush cache:rebuild
            #
            # See: script/production/README.md for complete workflows
            #
            # if [ -d "${SITE_PATH}/config/sync" ]; then
            #   echo "Deploying configuration..."
            #   sudo rsync -aq --delete "${SITE_PATH}/config/sync/" "${SITE_ROOT}/config/sync/"
            #   CONFIG_DEPLOYED=true
            #   echo "✅ Configuration deployed"
            # fi
            echo "ℹ️ Config deployment disabled (handle manually - see script/production/README.md)"
            
            # Composer update (only if files changed)
            local COMPOSER_CHANGED=false
            if [ -f "${SITE_PATH}/composer.json" ]; then
              if ! cmp -s "${SITE_PATH}/composer.json" "${SITE_ROOT}/composer.json"; then
                echo "Composer files changed, updating..."
                sudo cp "${SITE_PATH}/composer.json" "${SITE_ROOT}/"
                [ -f "${SITE_PATH}/composer.lock" ] && sudo cp "${SITE_PATH}/composer.lock" "${SITE_ROOT}/"
                COMPOSER_CHANGED=true
              fi
            fi
            
            cd "${SITE_ROOT}"
            
            if [ "$COMPOSER_CHANGED" = true ]; then
              echo "Installing composer dependencies..."
              sudo -u www-data composer install --no-dev --optimize-autoloader --apcu-autoloader --prefer-dist --no-interaction
              echo "✅ Composer updated"
            else
              echo "ℹ️ Composer files unchanged, skipping"
            fi
            
            # Determine if drush commands are needed
            local DRUSH_NEEDED=false
            if [ "$COMPOSER_CHANGED" = true ] || [ "$MODULES_DEPLOYED" = true ]; then
              DRUSH_NEEDED=true
            fi
            
            if [ "$DRUSH_NEEDED" = true ]; then
              # Skip config import - handle manually when needed
              # echo "Importing configuration..."
              # DRUSH_OUTPUT=$(sudo -u www-data ./vendor/bin/drush config:import -y 2>&1)
              
              # Database updates (applies schema changes from module updates)
              echo "Checking for database updates..."
              DRUSH_OUTPUT=$(sudo -u www-data ./vendor/bin/drush updatedb -y 2>&1) || DRUSH_EXIT=$?
              DRUSH_EXIT=${DRUSH_EXIT:-0}
              echo "🐛 drush updatedb exit code: $DRUSH_EXIT"
              if [ $DRUSH_EXIT -ne 0 ]; then
                echo "⚠️ Database update had warnings (exit code: $DRUSH_EXIT)"
                echo "--- Full drush output ---"
                echo "$DRUSH_OUTPUT"
                echo "--- End drush output ---"
              else
                echo "$DRUSH_OUTPUT" | grep -i 'update\|no pending' || echo "ℹ️ No updates needed"
              fi
            else
              echo "ℹ️ No module/config changes, skipping drush commands"
            fi
            
            # Fix permissions (optimized single pass)
            echo "Setting permissions..."
            sudo chown -R www-data:www-data "${SITE_ROOT}/web/modules/custom" \
              "${SITE_ROOT}/web/themes/custom" \
              "${SITE_ROOT}/config" 2>/dev/null || true
            
            sudo chmod -R u=rwX,g=rX,o=rX "${SITE_ROOT}/web/modules/custom" \
              "${SITE_ROOT}/web/themes/custom" \
              "${SITE_ROOT}/config" 2>/dev/null || true
            
            # Cache clearing - optimized based on what changed
            if [ "$DRUSH_NEEDED" = true ]; then
              echo "Full cache rebuild (modules/config changed)..."
              echo "🐛 Running cache:rebuild..."
              CACHE_OUTPUT=$(sudo -u www-data ./vendor/bin/drush cache:rebuild 2>&1) || CACHE_EXIT=$?
              CACHE_EXIT=${CACHE_EXIT:-0}
              echo "🐛 cache:rebuild exit code: $CACHE_EXIT"
              if [ $CACHE_EXIT -ne 0 ]; then
                echo "❌ Cache rebuild failed (exit code: $CACHE_EXIT)"
                echo "--- Full cache rebuild output ---"
                echo "$CACHE_OUTPUT"
                echo "--- End cache rebuild output ---"
                # Don't fail deployment for cache rebuild issues
              else
                echo "$CACHE_OUTPUT" | tail -2
              fi
            elif [ "$THEMES_DEPLOYED" = true ]; then
              echo "Clearing theme caches..."
              if sudo -u www-data ./vendor/bin/drush help cc 2>/dev/null | grep -q 'render'; then
                sudo -u www-data ./vendor/bin/drush cc render css-js 2>/dev/null || true
              else
                sudo -u www-data ./vendor/bin/drush cache:rebuild 2>&1 || true
              fi
            else
              echo "ℹ️ No cache clear needed"
            fi
            
            # Return to original directory
            cd "${START_DIR}"
            
            local SITE_END=$(date +%s)
            echo "✅ ${SITE_NAME} deployment complete in $((SITE_END - SITE_START))s"
            echo "🐛 ${SITE_NAME} deployment function exiting with status 0"
            return 0
          }
          
          # Deploy sites in parallel
          FORSETI_DEPLOYED=false
          DC_DEPLOYED=false
          
          # Start Forseti deployment in background (if changed)
          if echo "$CHANGED_FILES" | grep -q "^sites/forseti/" || [ -z "$CHANGED_FILES" ]; then
            echo ""
            echo "🐛 Starting Forseti deployment in background..."
            (
              set -e
              echo "🐛 Forseti background process started (PID: $$)"
              deploy_site "FORSETI" "/var/www/html/forseti" "sites/forseti" || FORSETI_FUNC_EXIT=$?
              FORSETI_FUNC_EXIT=${FORSETI_FUNC_EXIT:-0}
              echo "🐛 Forseti deploy_site function returned: $FORSETI_FUNC_EXIT"
              echo "FORSETI_DONE" > /tmp/forseti_status
              echo "🐛 Forseti background process exiting with: $FORSETI_FUNC_EXIT"
              exit $FORSETI_FUNC_EXIT
            ) &
            FORSETI_PID=$!
            FORSETI_DEPLOYED=true
            echo "🐛 Forseti deployment started with PID: $FORSETI_PID"
          else
            echo ""
            echo "ℹ️ Forseti site unchanged, skipping deployment"
          fi
          
          # Deploy production helper scripts
          if [ -d "script/production" ]; then
            if echo "$CHANGED_FILES" | grep -q "^script/production/" || [ -z "$CHANGED_FILES" ]; then
              echo ""
              echo "=== PRODUCTION SCRIPTS DEPLOYMENT ==="
              SCRIPTS_START=$(date +%s)
              sudo mkdir -p /var/www/html/scripts
              sudo rsync -aq script/production/ /var/www/html/scripts/
              sudo chmod +x /var/www/html/scripts/*.sh
              sudo chown -R root:root /var/www/html/scripts
              SCRIPT_COUNT=$(ls -1 /var/www/html/scripts/*.sh 2>/dev/null | wc -l)
              echo "✅ Deployed ${SCRIPT_COUNT} helper scripts in $(($(date +%s) - SCRIPTS_START))s"
            else
              echo ""
              echo "ℹ️ Production scripts unchanged, skipping deployment"
            fi
          fi
          
          # Deploy H3 geolocation (if exists and changed)
          if [ -d "h3-geolocation" ]; then
            if echo "$CHANGED_FILES" | grep -q "^h3-geolocation/" || [ -z "$CHANGED_FILES" ]; then
              echo ""
              echo "=== H3 GEOLOCATION DEPLOYMENT ==="
              H3_START=$(date +%s)
              sudo rsync -azq --exclude='h3-env' --exclude='__pycache__' --exclude='.git' --exclude='*.pyc' h3-geolocation/ "/var/www/html/forseti/h3-geolocation/"
              echo "✅ H3 deployed in $(($(date +%s) - H3_START))s"
            else
              echo ""
              echo "ℹ️ H3 geolocation unchanged, skipping deployment"
            fi
          fi
          
          # Start Dungeon Crawler deployment in background (if changed)
          DC_ROOT="/var/www/html/dungeoncrawler"
          if [ -d "sites/dungeoncrawler/web/modules/custom" ]; then
            if echo "$CHANGED_FILES" | grep -q "^sites/dungeoncrawler/" || [ -z "$CHANGED_FILES" ]; then
              echo ""
              echo "🐛 Starting Dungeon Crawler deployment in background..."
              (
                set -e
                echo "🐛 DC background process started (PID: $$)"
                deploy_site "DUNGEON CRAWLER" "$DC_ROOT" "sites/dungeoncrawler" || DC_FUNC_EXIT=$?
                DC_FUNC_EXIT=${DC_FUNC_EXIT:-0}
                echo "🐛 DC deploy_site function returned: $DC_FUNC_EXIT"
                echo "DC_DONE" > /tmp/dc_status
                echo "🐛 DC background process exiting with: $DC_FUNC_EXIT"
                exit $DC_FUNC_EXIT
              ) &
              DC_PID=$!
              DC_DEPLOYED=true
              echo "🐛 Dungeon Crawler deployment started with PID: $DC_PID"
            else
              echo ""
              echo "ℹ️ Dungeon Crawler unchanged, skipping deployment"
            fi
          else
            echo ""
            echo "ℹ️ Dungeon Crawler source not found in repository, skipping"
          fi
          
          # Wait for all site deployments to complete
          echo ""
          echo "🐛 Waiting for background deployments..."
          echo "🐛 FORSETI_DEPLOYED=$FORSETI_DEPLOYED, FORSETI_PID=${FORSETI_PID:-NONE}"
          echo "🐛 DC_DEPLOYED=$DC_DEPLOYED, DC_PID=${DC_PID:-NONE}"
          
          if [ "$FORSETI_DEPLOYED" = true ]; then
            echo "Waiting for Forseti deployment to complete..."
            wait $FORSETI_PID || FORSETI_EXIT=$?
            FORSETI_EXIT=${FORSETI_EXIT:-0}
            echo "🐛 Forseti deployment exit code: $FORSETI_EXIT"
            if [ $FORSETI_EXIT -ne 0 ]; then
              echo "❌ Forseti deployment failed with exit code $FORSETI_EXIT"
              cat /tmp/forseti_status 2>/dev/null || echo "No status file found"
            fi
          fi
          
          if [ "$DC_DEPLOYED" = true ]; then
            echo "Waiting for Dungeon Crawler deployment to complete..."
            wait $DC_PID || DC_EXIT=$?
            DC_EXIT=${DC_EXIT:-0}
            echo "🐛 Dungeon Crawler deployment exit code: $DC_EXIT"
            if [ $DC_EXIT -ne 0 ]; then
              echo "❌ Dungeon Crawler deployment failed with exit code $DC_EXIT"
              cat /tmp/dc_status 2>/dev/null || echo "No status file found"
            fi
          fi
          
          # Clean up status files
          rm -f /tmp/forseti_status /tmp/dc_status
          
          # Health checks (only for deployed sites)
          echo ""
          echo "=== HEALTH CHECKS ==="
          
          if [ "$FORSETI_DEPLOYED" = true ]; then
            echo "Testing Forseti..."
            HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" --max-time 10 https://forseti.life 2>&1) || HTTP_CODE="000"
            echo "🐛 Forseti HTTP response: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Forseti.life is responding (200 OK)"
            else
              echo "❌ Forseti.life health check failed (HTTP $HTTP_CODE)"
              echo "🐛 Attempting verbose curl for debugging..."
              curl -v --max-time 10 https://forseti.life 2>&1 | head -20 || true
              exit 1
            fi
          else
            echo "ℹ️ Forseti not deployed, skipping health check"
          fi
          
          if [ "$DC_DEPLOYED" = true ]; then
            echo "Testing Dungeon Crawler..."
            DC_HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" --max-time 10 https://dungeoncrawler.forseti.life 2>&1) || DC_HTTP_CODE="000"
            echo "🐛 Dungeon Crawler HTTP response: $DC_HTTP_CODE"
            if [ "$DC_HTTP_CODE" = "200" ]; then
              echo "✅ Dungeon Crawler is responding (200 OK)"
            else
              echo "⚠️ Dungeon Crawler health check failed (HTTP $DC_HTTP_CODE)"
              echo "🐛 Continuing despite DC health check failure..."
            fi
          else
            [ -d "$DC_ROOT" ] && echo "ℹ️ Dungeon Crawler not deployed, skipping health check"
          fi
          
          # Clean up
          echo ""
          echo "🐛 Cleaning up temporary files..."
          cd /tmp
          rm -rf "$TEMP_DIR"
          echo "🐛 Cleanup complete"
          
          DEPLOY_END=$(date +%s)
          TOTAL_TIME=$((DEPLOY_END - DEPLOY_START))
          
          echo ""
          echo "🎉 DEPLOYMENT COMPLETED at $(date)"
          echo "⏱️  Total deployment time: ${TOTAL_TIME}s"
          echo ""
          echo "=== DEPLOYMENT SUMMARY ==="
          [ "$FORSETI_DEPLOYED" = true ] && echo "✅ Forseti deployed (exit: ${FORSETI_EXIT:-0})" || echo "⏭️  Forseti skipped"
          [ "$DC_DEPLOYED" = true ] && echo "✅ Dungeon Crawler deployed (exit: ${DC_EXIT:-0})" || echo "⏭️  Dungeon Crawler skipped"
          echo ""
          echo "🌐 Changes live at https://forseti.life"
          echo "🐛 Script completed successfully"
          
          exit 0

