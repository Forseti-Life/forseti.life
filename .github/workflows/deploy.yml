name: Deploy Forseti Site to Production (Optimized)

on:
  push:
    branches: [ main ]
    paths:
      - 'sites/forseti/web/modules/custom/**'
      - 'sites/forseti/web/themes/custom/**'
      - 'sites/forseti/composer.json'
      - 'sites/forseti/composer.lock'
      # Config changes require manual deployment - excluded from auto-deploy
      # - 'sites/forseti/config/sync/**'
      - 'sites/dungeoncrawler/web/modules/custom/**'
      - 'sites/dungeoncrawler/web/themes/custom/**'
      - 'sites/dungeoncrawler/composer.json'
      - 'sites/dungeoncrawler/composer.lock'
      # Config changes require manual deployment - excluded from auto-deploy
      # - 'sites/dungeoncrawler/config/sync/**'
      - 'h3-geolocation/**'
      - 'script/production/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Deploy to production
      uses: appleboy/ssh-action@v0.1.5
      env:
        HUBGIT_PAT: ${{ secrets.HUBGIT_PAT }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_ACTOR: ${{ github.actor }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        envs: HUBGIT_PAT,GITHUB_SHA,GITHUB_ACTOR,COMMIT_MESSAGE
        script: |
          set -e
          
          DEPLOY_START=$(date +%s)
          echo "🚀 DEPLOYMENT STARTED at $(date)"
          echo "📝 Commit: ${GITHUB_SHA:0:8}"
          echo "👤 Author: $GITHUB_ACTOR"
          echo "💬 Message: $COMMIT_MESSAGE"
          
          # Validate production environment
          if [ ! -d "/var/www/html" ]; then
            echo "❌ Production web root /var/www/html not found"
            exit 1
          fi
          echo "✅ Production environment validated"
          
          TEMP_DIR="/tmp/deploy-$(date +%s)"
          
          # Optimized git clone
          mkdir -p "$TEMP_DIR"
          cd "$TEMP_DIR"
          
          echo "Downloading code from repository..."
          git clone --depth 1 --single-branch --branch main --filter=blob:none --sparse https://${HUBGIT_PAT}@github.com/keithaumiller/forseti.life.git .
          git sparse-checkout set sites/forseti sites/dungeoncrawler h3-geolocation
          
          # Detect what changed in this deployment
          echo "Detecting changed files..."
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null || echo "")
          echo "Changed paths: $(echo "$CHANGED_FILES" | grep -E '^(sites/|h3-geolocation/)' | cut -d'/' -f1-2 | sort -u | tr '\n' ' ')"
          
          # Reusable deployment function
          deploy_site() {
            local SITE_NAME=$1
            local SITE_ROOT=$2
            local SITE_PATH=$3
            local START_DIR=$(pwd)
            
            echo ""
            echo "=== ${SITE_NAME} DEPLOYMENT ==="
            local SITE_START=$(date +%s)
            
            # Track what was deployed
            local MODULES_DEPLOYED=false
            local THEMES_DEPLOYED=false
            local CONFIG_DEPLOYED=false
            
            # Deploy custom modules
            if [ -d "${SITE_PATH}/web/modules/custom" ]; then
              echo "Deploying custom modules..."
              sudo rsync -aq --delete "${SITE_PATH}/web/modules/custom/" "${SITE_ROOT}/web/modules/custom/"
              MODULES_DEPLOYED=true
              echo "✅ Modules deployed"
            fi
            
            # Deploy custom themes
            if [ -d "${SITE_PATH}/web/themes/custom" ]; then
              echo "Deploying custom themes..."
              sudo rsync -aq --delete "${SITE_PATH}/web/themes/custom/" "${SITE_ROOT}/web/themes/custom/"
              THEMES_DEPLOYED=true
              echo "✅ Themes deployed"
            fi
            
            # Deploy configuration - DISABLED
            # Config should be managed manually: export from prod, commit to dev, then deploy
            # Automatic config deployment is dangerous and can wipe production config
            # if [ -d "${SITE_PATH}/config/sync" ]; then
            #   echo "Deploying configuration..."
            #   sudo rsync -aq --delete "${SITE_PATH}/config/sync/" "${SITE_ROOT}/config/sync/"
            #   CONFIG_DEPLOYED=true
            #   echo "✅ Configuration deployed"
            # fi
            echo "ℹ️ Config deployment disabled (handle manually)"
            
            # Composer update (only if files changed)
            local COMPOSER_CHANGED=false
            if [ -f "${SITE_PATH}/composer.json" ]; then
              if ! cmp -s "${SITE_PATH}/composer.json" "${SITE_ROOT}/composer.json"; then
                echo "Composer files changed, updating..."
                sudo cp "${SITE_PATH}/composer.json" "${SITE_ROOT}/"
                [ -f "${SITE_PATH}/composer.lock" ] && sudo cp "${SITE_PATH}/composer.lock" "${SITE_ROOT}/"
                COMPOSER_CHANGED=true
              fi
            fi
            
            cd "${SITE_ROOT}"
            
            if [ "$COMPOSER_CHANGED" = true ]; then
              echo "Installing composer dependencies..."
              sudo -u www-data composer install --no-dev --optimize-autoloader --apcu-autoloader --prefer-dist --no-interaction
              echo "✅ Composer updated"
            else
              echo "ℹ️ Composer files unchanged, skipping"
            fi
            
            # Determine if drush commands are needed
            local DRUSH_NEEDED=false
            if [ "$COMPOSER_CHANGED" = true ] || [ "$MODULES_DEPLOYED" = true ]; then
              DRUSH_NEEDED=true
            fi
            
            if [ "$DRUSH_NEEDED" = true ]; then
              # Skip config import - handle manually when needed
              # echo "Importing configuration..."
              # DRUSH_OUTPUT=$(sudo -u www-data ./vendor/bin/drush config:import -y 2>&1)
              
              # Database updates (applies schema changes from module updates)
              echo "Checking for database updates..."
              DRUSH_OUTPUT=$(sudo -u www-data ./vendor/bin/drush updatedb -y 2>&1)
              DRUSH_EXIT=$?
              if [ $DRUSH_EXIT -ne 0 ]; then
                echo "⚠️ Database update had warnings (exit code: $DRUSH_EXIT)"
                echo "$DRUSH_OUTPUT" | tail -5
              else
                echo "$DRUSH_OUTPUT" | grep -i 'update\|no pending' || echo "ℹ️ No updates needed"
              fi
            else
              echo "ℹ️ No module/config changes, skipping drush commands"
            fi
            
            # Fix permissions (optimized single pass)
            echo "Setting permissions..."
            sudo chown -R www-data:www-data "${SITE_ROOT}/web/modules/custom" \
              "${SITE_ROOT}/web/themes/custom" \
              "${SITE_ROOT}/config" 2>/dev/null || true
            
            sudo chmod -R u=rwX,g=rX,o=rX "${SITE_ROOT}/web/modules/custom" \
              "${SITE_ROOT}/web/themes/custom" \
              "${SITE_ROOT}/config" 2>/dev/null || true
            
            # Cache clearing - optimized based on what changed
            if [ "$DRUSH_NEEDED" = true ]; then
              echo "Full cache rebuild (modules/config changed)..."
              sudo -u www-data ./vendor/bin/drush cache:rebuild
            elif [ "$THEMES_DEPLOYED" = true ]; then
              echo "Clearing theme caches..."
              if sudo -u www-data ./vendor/bin/drush help cc 2>/dev/null | grep -q 'render'; then
                sudo -u www-data ./vendor/bin/drush cc render css-js 2>/dev/null
              else
                sudo -u www-data ./vendor/bin/drush cache:rebuild
              fi
            else
              echo "ℹ️ No cache clear needed"
            fi
            
            # Return to original directory
            cd "${START_DIR}"
            
            local SITE_END=$(date +%s)
            echo "✅ ${SITE_NAME} deployment complete in $((SITE_END - SITE_START))s"
          }
          
          # Deploy Forseti (only if changed)
          FORSETI_DEPLOYED=false
          if echo "$CHANGED_FILES" | grep -q "^sites/forseti/" || [ -z "$CHANGED_FILES" ]; then
            deploy_site "FORSETI" "/var/www/html/forseti" "sites/forseti"
            FORSETI_DEPLOYED=true
          else
            echo ""
            echo "ℹ️ Forseti site unchanged, skipping deployment"
          fi
          
          # Deploy production helper scripts
          if [ -d "script/production" ]; then
            if echo "$CHANGED_FILES" | grep -q "^script/production/" || [ -z "$CHANGED_FILES" ]; then
              echo ""
              echo "=== PRODUCTION SCRIPTS DEPLOYMENT ==="
              SCRIPTS_START=$(date +%s)
              sudo mkdir -p /var/www/html/scripts
              sudo rsync -aq script/production/ /var/www/html/scripts/
              sudo chmod +x /var/www/html/scripts/*.sh
              sudo chown -R root:root /var/www/html/scripts
              SCRIPT_COUNT=$(ls -1 /var/www/html/scripts/*.sh 2>/dev/null | wc -l)
              echo "✅ Deployed ${SCRIPT_COUNT} helper scripts in $(($(date +%s) - SCRIPTS_START))s"
            else
              echo ""
              echo "ℹ️ Production scripts unchanged, skipping deployment"
            fi
          fi
          
          # Deploy H3 geolocation (if exists and changed)
          if [ -d "h3-geolocation" ]; then
            if echo "$CHANGED_FILES" | grep -q "^h3-geolocation/" || [ -z "$CHANGED_FILES" ]; then
              echo ""
              echo "=== H3 GEOLOCATION DEPLOYMENT ==="
              H3_START=$(date +%s)
              sudo rsync -aq --delete --exclude='h3-env' --exclude='__pycache__' h3-geolocation/ "/var/www/html/forseti/h3-geolocation/"
              echo "✅ H3 deployed in $(($(date +%s) - H3_START))s"
            else
              echo ""
              echo "ℹ️ H3 geolocation unchanged, skipping deployment"
            fi
          fi
          
          # Deploy Dungeon Crawler (if site exists on production and changed)
          DC_ROOT="/var/www/html/dungeoncrawler"
          DC_DEPLOYED=false
          if [ -d "$DC_ROOT" ] && [ -d "sites/dungeoncrawler/web/modules/custom" ]; then
            if echo "$CHANGED_FILES" | grep -q "^sites/dungeoncrawler/" || [ -z "$CHANGED_FILES" ]; then
              deploy_site "DUNGEON CRAWLER" "$DC_ROOT" "sites/dungeoncrawler"
              DC_DEPLOYED=true
            else
              echo ""
              echo "ℹ️ Dungeon Crawler unchanged, skipping deployment"
            fi
          else
            echo ""
            echo "ℹ️ Dungeon Crawler not set up on production yet, skipping"
          fi
          
          # Health checks (only for deployed sites)
          echo ""
          echo "=== HEALTH CHECKS ==="
          
          if [ "$FORSETI_DEPLOYED" = true ]; then
            echo "Testing Forseti..."
            HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" --max-time 10 https://forseti.life || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Forseti.life is responding (200 OK)"
            else
              echo "❌ Forseti.life health check failed (HTTP $HTTP_CODE)"
              exit 1
            fi
          else
            echo "ℹ️ Forseti not deployed, skipping health check"
          fi
          
          if [ "$DC_DEPLOYED" = true ]; then
            echo "Testing Dungeon Crawler..."
            DC_HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" --max-time 10 https://dungeoncrawler.forseti.life || echo "000")
            if [ "$DC_HTTP_CODE" = "200" ]; then
              echo "✅ Dungeon Crawler is responding (200 OK)"
            else
              echo "⚠️ Dungeon Crawler health check failed (HTTP $DC_HTTP_CODE)"
            fi
          else
            [ -d "$DC_ROOT" ] && echo "ℹ️ Dungeon Crawler not deployed, skipping health check"
          fi
          
          # Clean up
          cd /tmp
          rm -rf "$TEMP_DIR"
          
          DEPLOY_END=$(date +%s)
          TOTAL_TIME=$((DEPLOY_END - DEPLOY_START))
          
          echo ""
          echo "🎉 DEPLOYMENT COMPLETED at $(date)"
          echo "⏱️  Total deployment time: ${TOTAL_TIME}s"
          echo ""
          echo "=== DEPLOYMENT SUMMARY ==="
          [ "$FORSETI_DEPLOYED" = true ] && echo "✅ Forseti deployed" || echo "⏭️  Forseti skipped"
          [ "$DC_DEPLOYED" = true ] && echo "✅ Dungeon Crawler deployed" || echo "⏭️  Dungeon Crawler skipped"
          echo ""
          echo "🌐 Changes live at https://forseti.life"

