name: Tester Fix PR

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create_pr_for_tester_fix:
    if: contains(github.event.issue.labels.*.name, 'tester-fix')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure base branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin testing; then
            echo "Base branch 'testing' not found on origin. Please create it." >&2
            exit 1
          fi

      - name: Prepare variables
        id: vars
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          BRANCH="tester-fix/issue-${ISSUE_NUMBER}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "issue_url=${{ github.event.issue.html_url }}" >> "$GITHUB_OUTPUT"

      - name: Create scaffold commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ steps.vars.outputs.branch }}" origin/testing

          mkdir -p .github/tester-fixes
          cat > ".github/tester-fixes/issue-${{ steps.vars.outputs.issue_number }}.md" <<'EOF'
Issue: ${{ github.event.issue.html_url }}
Status: draft
Notes: Add commits to address tester findings for this issue.
EOF

          git add .github/tester-fixes/issue-${{ steps.vars.outputs.issue_number }}.md
          git commit -m "tester-fix: scaffold for issue #${{ steps.vars.outputs.issue_number }}"

      - name: Push branch
        run: git push origin "${{ steps.vars.outputs.branch }}" --force

      - name: Open draft PR against testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base testing \
            --head "${{ steps.vars.outputs.branch }}" \
            --title "Tester fix for #${{ steps.vars.outputs.issue_number }}" \
            --body "Draft fix for ${{ github.event.issue.html_url }}.\n\n- Please add commits to address tester findings.\n- Auto-generated by tester-fix workflow." \
            --draft

      - name: Ensure issue is labeled and assigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ steps.vars.outputs.issue_number }} --add-label "tester-fix" --add-assignee "@copilot"
          PR_URL=$(gh pr view "${{ steps.vars.outputs.branch }}" --json url -q .url)
          gh issue comment ${{ steps.vars.outputs.issue_number }} --body "Draft PR opened: ${PR_URL}"
