name: Merge issue branches into testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-issue-branches-into-testing
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge copilot-assigned PR branches into testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          git fetch origin testing
          git switch -C testing origin/testing

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          prs=$(gh pr list --state open --json number,title,headRefName,baseRefName,isDraft,mergeStateStatus \
            --jq '.[] | @base64')

          if [ -z "$prs" ]; then
            echo "No open PRs assigned to copilot."
            exit 0
          fi

          merged=0
          decode() { echo "$1" | base64 --decode; }

          for pr in $prs; do
            data=$(decode "$pr")
            number=$(echo "$data" | jq -r '.number')
            title=$(echo "$data" | jq -r '.title')
            head=$(echo "$data" | jq -r '.headRefName')
            base=$(echo "$data" | jq -r '.baseRefName')
            merge_state=$(echo "$data" | jq -r '.mergeStateStatus')

            meta=$(gh pr view "$number" --json isDraft,reviewRequests,assignees,reviewDecision,statusCheckRollup --jq '{isDraft,reviewDecision,reviewRequests:[.reviewRequests[].login],assignees:[.assignees[].login],statusCheckRollup:.statusCheckRollup}')
            is_draft=$(echo "$meta" | jq -r '.isDraft')
            review_decision=$(echo "$meta" | jq -r '.reviewDecision // ""')
            copilot_requested=$(echo "$meta" | jq -r '.reviewRequests[]? | ascii_downcase' | grep -x "copilot" || true)
            copilot_assigned=$(echo "$meta" | jq -r '.assignees[]? | ascii_downcase' | grep -x "copilot" || true)
            failing_checks=$(echo "$meta" | jq -r '[.statusCheckRollup[]? | select((.conclusion // "") | ascii_downcase | test("failure|cancelled|timed_out|action_required|stale"))] | length')
            pending_checks=$(echo "$meta" | jq -r '[.statusCheckRollup[]? | select((.status // "") | ascii_downcase | test("queued|in_progress|pending"))] | length')

            if [ "$base" != "main" ]; then
              echo "Skipping PR #$number ($head -> $base): base is not main."
              continue
            fi

            if [ -z "$copilot_requested" ] && [ -z "$copilot_assigned" ]; then
              echo "Skipping PR #$number ($head -> $base): no Copilot review request or assignment."
              continue
            fi

            if [ "$is_draft" = "true" ]; then
              echo "Skipping draft PR #$number ($head -> $base): $title"
              continue
            fi

            if [ "$merge_state" != "CLEAN" ] && [ "$merge_state" != "HAS_HOOKS" ]; then
              echo "Skipping PR #$number ($head -> $base): mergeStateStatus=$merge_state"
              continue
            fi

            if [ "$review_decision" = "CHANGES_REQUESTED" ]; then
              echo "Skipping PR #$number ($head -> $base): review decision is CHANGES_REQUESTED"
              continue
            fi

            if [ "$failing_checks" -gt 0 ]; then
              echo "Skipping PR #$number ($head -> $base): failing checks detected ($failing_checks)"
              continue
            fi

            if [ "$pending_checks" -gt 0 ]; then
              echo "Skipping PR #$number ($head -> $base): pending checks detected ($pending_checks)"
              continue
            fi

            echo "Processing PR #$number ($head -> $base): $title"
            git fetch origin "$head"

            if git merge --no-ff "origin/$head" -m "Merge PR #$number into testing: $title"; then
              merged=1
              echo "Merged #$number from $head"
            else
              git merge --abort || true
              echo "::warning::Merge conflict for #$number ($head); skipped"
            fi
          done

          if [ "$merged" -eq 1 ]; then
            git push origin testing
            echo "Pushed updates to testing."
          else
            echo "No merges applied; testing unchanged."
          fi
