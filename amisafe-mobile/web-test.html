<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmISafe Mobile - Authentication Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .user-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        .demo-credentials {
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #ffeaa7;
        }
        .demo-credentials strong {
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ AmISafe Mobile</h1>
            <p>Authentication Test - Basic Drupal Integration</p>
        </div>

        <div class="demo-credentials">
            <strong>Demo Credentials:</strong><br>
            Username: <code>demo</code><br>
            Password: <code>demo</code><br>
            <small>Or use any username/password for demo mode</small>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value="demo" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" value="demo" required>
            </div>
            
            <button type="submit" id="loginBtn">🔐 Login</button>
        </form>

        <div id="result" class="result"></div>
        <div id="userInfo" class="user-info"></div>

        <div style="margin-top: 30px; text-align: center;">
            <button onclick="testApiEndpoints()" id="testApiBtn" style="background: #28a745; display: none;">
                🧪 Test API Endpoints
            </button>
            <button onclick="logout()" id="logoutBtn" style="background: #dc3545; display: none;">
                🚪 Logout
            </button>
        </div>
    </div>

    <script>
        // Mock AsyncStorage for web
        window.AsyncStorage = {
            setItem: (key, value) => localStorage.setItem(key, value),
            getItem: (key) => Promise.resolve(localStorage.getItem(key)),
            removeItem: (key) => localStorage.removeItem(key),
            multiSet: (pairs) => {
                pairs.forEach(([key, value]) => localStorage.setItem(key, value));
                return Promise.resolve();
            },
            multiGet: (keys) => {
                return Promise.resolve(keys.map(key => [key, localStorage.getItem(key)]));
            },
            multiRemove: (keys) => {
                keys.forEach(key => localStorage.removeItem(key));
                return Promise.resolve();
            }
        };

        // Simple authentication service for web testing
        class WebAuthService {
            constructor() {
                this.baseUrl = 'http://localhost';
                this.csrfToken = null;
                this.currentUser = null;
                this.sessionToken = null;
            }

            async getCsrfToken() {
                try {
                    const response = await fetch(`${this.baseUrl}/session/token`);
                    return await response.text();
                } catch (error) {
                    console.error('Failed to get CSRF token:', error);
                    return null;
                }
            }

            async login(username, password) {
                try {
                    console.log('🔐 Attempting demo login for:', username);
                    
                    // For web demo, use simple demo authentication
                    if (username && password) {
                        this.currentUser = {
                            uid: 999,
                            name: username,
                            mail: `${username}@example.com`,
                            roles: ['authenticated'],
                            demo: true,
                            loginMethod: 'web-demo'
                        };
                        
                        await AsyncStorage.setItem('amisafe_user', JSON.stringify(this.currentUser));
                        
                        return {
                            success: true,
                            user: this.currentUser,
                            demo: true
                        };
                    }
                    
                    throw new Error('Invalid credentials');
                } catch (error) {
                    throw new Error('Login failed. Please check your credentials.');
                }
            }

            async logout() {
                this.currentUser = null;
                this.sessionToken = null;
                this.csrfToken = null;
                await AsyncStorage.removeItem('amisafe_user');
            }

            isAuthenticated() {
                return !!this.currentUser;
            }

            getCurrentUser() {
                return this.currentUser;
            }

            async testApiEndpoint(endpoint) {
                try {
                    const response = await fetch(`${this.baseUrl}${endpoint}`);
                    const data = await response.json();
                    return {
                        status: response.status,
                        data: data,
                        success: response.ok
                    };
                } catch (error) {
                    return {
                        status: 'error',
                        error: error.message,
                        success: false
                    };
                }
            }
        }

        const authService = new WebAuthService();

        // Form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const result = document.getElementById('result');
            const userInfo = document.getElementById('userInfo');

            loginBtn.disabled = true;
            loginBtn.textContent = '🔄 Logging in...';

            try {
                const loginResult = await authService.login(username, password);
                
                if (loginResult.success) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>✅ Login Successful!</strong><br>
                        ${loginResult.demo ? '(Demo mode enabled)' : ''}
                    `;
                    result.style.display = 'block';

                    userInfo.innerHTML = `
                        <h3>👤 User Information</h3>
                        <p><strong>Name:</strong> ${loginResult.user.name}</p>
                        <p><strong>Email:</strong> ${loginResult.user.mail}</p>
                        <p><strong>Roles:</strong> ${loginResult.user.roles.join(', ')}</p>
                        <p><strong>Login Method:</strong> ${loginResult.user.loginMethod}</p>
                    `;
                    userInfo.style.display = 'block';

                    document.getElementById('testApiBtn').style.display = 'inline-block';
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                } else {
                    throw new Error('Login failed');
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `<strong>❌ Login Failed:</strong><br>${error.message}`;
                result.style.display = 'block';
            }

            loginBtn.disabled = false;
            loginBtn.textContent = '🔐 Login';
        });

        async function testApiEndpoints() {
            const result = document.getElementById('result');
            result.className = 'result';
            result.innerHTML = '🧪 Testing API endpoints...';
            result.style.display = 'block';

            const endpoints = [
                '/api/amisafe/debug',
                '/api/amisafe/system-stats',
                '/api/amisafe/crime-types',
                '/api/amisafe/aggregated'
            ];

            let resultsHtml = '<h3>🔗 API Test Results</h3>';

            for (const endpoint of endpoints) {
                const testResult = await authService.testApiEndpoint(endpoint);
                const statusIcon = testResult.success ? '✅' : '❌';
                resultsHtml += `<p>${statusIcon} ${endpoint}: ${testResult.status}</p>`;
            }

            result.innerHTML = resultsHtml;
        }

        async function logout() {
            await authService.logout();
            
            document.getElementById('result').style.display = 'none';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('testApiBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            
            document.getElementById('username').value = 'demo';
            document.getElementById('password').value = 'demo';
        }
    </script>
</body>
</html>
