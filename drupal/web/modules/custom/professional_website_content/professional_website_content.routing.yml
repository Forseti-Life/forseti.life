professional_website_content.install_content:
  path: '/admin/install-content'
  defaults:
    _controller: '\Drupal\professional_website_content\Controller\ContentInstallController::installContent'
    _title: 'Install Professional Content'
  requirements:
    _permission: 'administer site configuration'

professional_website_content.services:
  path: '/services'
  defaults:
    _controller: '\Drupal\professional_website_content\Controller\ProfessionalContentController::servicesPage'
    _title: 'Services'
  requirements:
    _access: 'TRUE'

