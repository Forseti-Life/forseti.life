name: 'Job Application Automation'
type: module
description: 'AI-powered job application automation with comprehensive job tracking, application workflow, and external service integration.'
core_version_requirement: ^10 || ^11
version: '1.0.0'
package: 'St. Louis Integration'

dependencies:
  - drupal:node
  - drupal:user
  - drupal:field
  - drupal:system
  - drupal:views
  - drupal:datetime
  - drupal:options
  - drupal:link
  - drupal:file
  - drupal:image
  - drupal:text

configure: job_application_automation.settings

# Module maintainer information
author: 'St. Louis Integration Development Team'
homepage: 'https://stlouisintegration.com'
