    - field.field.profile.job_seeker.field_certifications
    - field.field.profile.job_seeker.field_cover_letter_template
    - field.field.profile.job_seeker.field_education_level
    - field.field.profile.job_seeker.field_experience_years
    - field.field.profile.job_seeker.field_github_url
    - field.field.profile.job_seeker.field_keywords_interested
    - field.field.profile.job_seeker.field_last_profile_update
    - field.field.profile.job_seeker.field_linkedin_url
    - field.field.profile.job_seeker.field_portfolio_url
    - field.field.profile.job_seeker.field_primary_resume_text
    - field.field.profile.job_seeker.field_professional_summary
    - field.field.profile.job_seeker.field_profile_completeness
    - field.field.profile.job_seeker.field_references_available
    - field.field.profile.job_seeker.field_relocation_willing
    - field.field.profile.job_seeker.field_remote_preference
    - field.field.profile.job_seeker.field_resume_file
    - field.field.profile.job_seeker.field_salary_expectation_max
    - field.field.profile.job_seeker.field_salary_expectation_min
    - field.field.profile.job_seeker.field_skills_summary
    - field.field.profile.job_seeker.field_target_companies
    - field.field.profile.job_seeker.field_target_job_titles
    - field.field.profile.job_seeker.field_work_authorization
    - profile.type.job_seeker
  module:
    - datetime
    - file
    - link
    - options
    - profile
    - text
id: profile.job_seeker.default
targetEntityType: profile
bundle: job_seeker
mode: default
content:
  # Resume and Profile Info
  field_resume_file:
    type: file_generic
    weight: 1
    region: content
    settings:
      progress_indicator: throbber
    third_party_settings: {  }
  field_primary_resume_text:
    type: text_textarea
    weight: 2
    region: content
    settings:
      rows: 6
      placeholder: 'Resume text will be automatically extracted from uploaded files...'
    third_party_settings: {  }
  
  # Basic Information
  field_professional_summary:
    type: text_textarea
    weight: 10
    region: content
    settings:
      rows: 4
      placeholder: 'Brief professional summary...'
    third_party_settings: {  }
  field_skills_summary:
    type: text_textarea
    weight: 11
    region: content
    settings:
      rows: 4
      placeholder: 'List your key skills and technologies...'
    third_party_settings: {  }
  field_experience_years:
    type: number
    weight: 12
    region: content
    settings:
      placeholder: ''
    third_party_settings: {  }
  field_education_level:
    type: options_select
    weight: 13
    region: content
    settings: {  }
    third_party_settings: {  }
  field_certifications:
    type: text_textarea
    weight: 14
    region: content
    settings:
      rows: 3
      placeholder: 'List your certifications...'
    third_party_settings: {  }
  
  # Work Preferences
  field_work_authorization:
    type: options_select
    weight: 20
    region: content
    settings: {  }
    third_party_settings: {  }
  field_salary_expectation_min:
    type: number
    weight: 21
    region: content
    settings:
      placeholder: '50000'
    third_party_settings: {  }
  field_salary_expectation_max:
    type: number
    weight: 22
    region: content
    settings:
      placeholder: '100000'
    third_party_settings: {  }
  field_available_start_date:
    type: datetime_default
    weight: 23
    region: content
    settings: {  }
    third_party_settings: {  }
  field_remote_preference:
    type: options_select
    weight: 24
    region: content
    settings: {  }
    third_party_settings: {  }
  field_relocation_willing:
    type: boolean_checkbox
    weight: 25
    region: content
    settings:
      display_label: true
    third_party_settings: {  }
  
  # Job Search Preferences
  field_target_job_titles:
    type: text_textarea
    weight: 30
    region: content
    settings:
      rows: 3
      placeholder: 'List desired job titles...'
    third_party_settings: {  }
  field_keywords_interested:
    type: text_textarea
    weight: 31
    region: content
    settings:
      rows: 3
      placeholder: 'Job search keywords...'
    third_party_settings: {  }
  field_target_companies:
    type: entity_reference_autocomplete
    weight: 32
    region: content
    settings:
      match_operator: CONTAINS
      size: 60
      placeholder: 'Start typing company names...'
    third_party_settings: {  }
  
  # Contact and Portfolio
  field_portfolio_url:
    type: link_default
    weight: 40
    region: content
    settings:
      placeholder_url: 'https://yourportfolio.com'
      placeholder_title: 'Portfolio'
    third_party_settings: {  }
  field_linkedin_url:
    type: link_default
    weight: 41
    region: content
    settings:
      placeholder_url: 'https://linkedin.com/in/yourprofile'
      placeholder_title: 'LinkedIn Profile'
    third_party_settings: {  }
  field_github_url:
    type: link_default
    weight: 42
    region: content
    settings:
      placeholder_url: 'https://github.com/yourusername'
      placeholder_title: 'GitHub Profile'
    third_party_settings: {  }
  field_references_available:
    type: boolean_checkbox
    weight: 43
    region: content
    settings:
      display_label: true
    third_party_settings: {  }
  
  # Templates and AI
  field_cover_letter_template:
    type: text_textarea
    weight: 50
    region: content
    settings:
      rows: 8
      placeholder: 'Default cover letter template...'
    third_party_settings: {  }

hidden:
  field_ai_analysis_data: true
  field_last_profile_update: true
  field_profile_completeness: true