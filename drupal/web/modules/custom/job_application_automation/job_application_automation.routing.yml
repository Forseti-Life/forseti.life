# Job Application Automation Routes
# Complete routing configuration for job application automation module

# Custom route for displaying job seeker profile in view mode (not edit mode)
job_application_automation.user_job_seeker_view:
  path: '/user/{user}/job_seeker/view'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\UserProfileController::viewJobSeekerProfile'
    _title: 'Job Seeker Profile'
  requirements:
    _permission: 'view own job application profile'
    user: \d+

# Job Discovery - Start Discovery Page
job_application_automation.start_job_discovery:
  path: '/user/{user}/job-discovery/start'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\UserProfileController::startJobDiscovery'
    _title: 'Start Job Discovery'
  requirements:
    _permission: 'view own job application profile'
    user: \d+

# Job Discovery - AJAX Search Endpoint
job_application_automation.job_discovery_search:
  path: '/job-discovery/search'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\UserProfileController::jobDiscoverySearch'
  requirements:
    _permission: 'view own job application profile'
  methods: [POST]

# 1. Master Dashboard Routes
job_application_automation.dashboard:
  path: '/job-dashboard'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\JobApplicationController::dashboard'
    _title: 'Job Application Dashboard'
  requirements:
    _permission: 'access user job applications'

# Alternative dashboard route (more intuitive URL)
job_application_automation.dashboard_alt:
  path: '/job-applications'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\JobApplicationController::dashboard'
    _title: 'Job Application Dashboard'
  requirements:
    _permission: 'access user job applications'

# Target Companies Management
job_application_automation.manage_target_companies:
  path: '/job-applications/manage-target-companies'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\JobApplicationController::manageTargetCompanies'
    _title: 'Manage Target Companies'
  requirements:
    _user: 'user.is_authenticated'

job_application_automation.save_target_companies:
  path: '/job-applications/save-target-companies'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\JobApplicationController::saveTargetCompanies'
  requirements:
    _user: 'user.is_authenticated'
  methods: [POST]

# Bulk Company Import
job_application_automation.bulk_import_companies:
  path: '/job-applications/bulk-import-companies'
  defaults:
    _form: '\Drupal\job_application_automation\Form\BulkCompanyImportForm'
    _title: 'Bulk Import Companies'
  requirements:
    _user: 'user.is_authenticated'

# Companies Overview
job_application_automation.companies_overview:
  path: '/job-applications/companies-overview'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\JobApplicationController::companiesOverview'
    _title: 'Companies Overview'
  requirements:
    _user: 'user.is_authenticated'

# 2. Application Management Routes
job_application_automation.add:
  path: '/admin/job-applications/add'
  defaults:
    _form: '\Drupal\job_application_automation\Form\JobApplicationForm'
    _title: 'Add Job Application'
  requirements:
    _permission: 'create job applications'

job_application_automation.edit:
  path: '/admin/job-applications/{job_application}/edit'
  defaults:
    _form: '\Drupal\job_application_automation\Form\JobApplicationForm'
    _title: 'Edit Job Application'
  requirements:
    _permission: 'edit job applications'
    _entity_access: 'job_application.update'

job_application_automation.view:
  path: '/admin/job-applications/{job_application}'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\JobApplicationController::view'
    _title_callback: '\Drupal\job_application_automation\Controller\JobApplicationController::getTitle'
  requirements:
    _permission: 'view job applications'
    _entity_access: 'job_application.view'

# 3. Workflow Management Routes
job_application_automation.workflow:
  path: '/admin/job-applications/workflow/{job_application}'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\WorkflowController::manage'
    _title: 'Manage Application Workflow'
  requirements:
    _permission: 'manage job application workflow'
    _entity_access: 'job_application.update'

job_application_automation.bulk_actions:
  path: '/admin/job-applications/bulk-actions'
  defaults:
    _form: '\Drupal\job_application_automation\Form\BulkActionsForm'
    _title: 'Bulk Actions'
  requirements:
    _permission: 'administer job applications'

# 4. User Profile Management Routes
job_application_automation.user_profile_dashboard:
  path: '/user/{user}/job-profile'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\UserProfileController::dashboard'
    _title: 'Job Application Profile'
  requirements:
    _permission: 'view own job application profile'
    user: \d+

job_application_automation.user_profile_edit:
  path: '/user/{user}/job-profile/edit'
  defaults:
    _form: '\Drupal\job_application_automation\Form\UserProfileForm'
    _title: 'Edit Job Application Profile'
  requirements:
    _permission: 'edit own job application profile'
    user: \d+

# 5. Current User Profile Shortcuts
job_application_automation.my_profile:
  path: '/my/job-profile'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\UserProfileController::myProfile'
    _title: 'My Job Application Profile'
  requirements:
    _permission: 'view own job application profile'

job_application_automation.my_profile_edit:
  path: '/my/job-profile/edit'
  defaults:
    _controller: '\Drupal\job_application_automation\Controller\UserProfileController::myProfileEdit'
    _title: 'Edit My Job Application Profile'
  requirements:
    _permission: 'edit own job application profile'

